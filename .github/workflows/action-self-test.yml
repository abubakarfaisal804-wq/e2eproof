name: action self-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-action:
    name: action-self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Start demo server
        shell: bash
        run: |
          python demo/server.py > demo-server.log 2>&1 &
          echo $! > demo-server.pid
          for i in {1..40}; do
            curl --fail --silent http://127.0.0.1:8765/health && exit 0
            sleep 0.25
          done
          cat demo-server.log
          exit 1
      - name: Use local E2EProof action
        uses: ./
        with:
          contract: examples/real.yaml
          output: action-evidence
          browser: chromium
          artifact-name: local-action-evidence
