name: quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-build-isolation -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests demo scripts
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy src/e2eproof
      - name: Release static audit
        run: python scripts/static_audit.py

  unit:
    name: Unit ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-build-isolation -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -m "not browser and not integration" -q

  coverage:
    name: Full coverage with Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --no-build-isolation -e ".[dev]"
          e2eproof install-browser chromium --with-deps
      - name: Full test suite
        run: python -m pytest --cov=e2eproof --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  package:
    name: Build and clean-install package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Clean wheel smoke test
        shell: bash
        run: |
          python -m venv /tmp/e2eproof-wheel-test
          /tmp/e2eproof-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/e2eproof-wheel-test/bin/e2eproof --version
          /tmp/e2eproof-wheel-test/bin/e2eproof init /tmp/e2eproof.yaml
          /tmp/e2eproof-wheel-test/bin/e2eproof validate /tmp/e2eproof.yaml
      - uses: actions/upload-artifact@v7
        with:
          name: python-package
          path: dist/*

  quality-gate:
    name: quality-gate
    if: always()
    needs: [static, unit, coverage, package]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all quality jobs
        shell: bash
        run: |
          test "${{ needs.static.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.coverage.result }}" = "success"
          test "${{ needs.package.result }}" = "success"
