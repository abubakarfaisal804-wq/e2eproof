name: release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build, verify, attest, and attach assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check tag matches package version
        shell: bash
        run: |
          expected="v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          test "$expected" = "${{ github.event.release.tag_name }}"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Attest release files
        uses: actions/attest@v4
        with:
          subject-path: dist/*
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: release-distributions
          path: dist/*

  publish-pypi:
    name: Publish to PyPI with Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/e2eproof
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release-distributions
          path: dist
      - name: Remove checksum file before PyPI upload
        shell: bash
        run: rm -f dist/SHA256SUMS.txt
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
