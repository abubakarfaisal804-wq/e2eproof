version: 1
name: Real lead persistence
base_url: http://127.0.0.1:8765
variables:
  email: real+{{run_id}}@example.com
browser:
  engine: chromium
  headless: true
policy:
  timeout_ms: 8000
  navigation_timeout_ms: 15000
  retries: 0
  allowed_hosts: [127.0.0.1, localhost]
  fail_on_console_error: true
  fail_on_page_error: true
  fail_on_request_failure: true
  forbidden_visible_markers: [demo mode, mock response, fallback active]
  forbidden_network_markers: [fallback active]
evidence:
  output_dir: evidence
  screenshot: failure
  trace: failure
  include_console: true
  include_network: true
  include_response_bodies: true
flows:
  - id: exact-once-lead
    claim: The submitted lead is persisted exactly once and a confirmation is shown.
    steps:
      - type: http.request
        method: POST
        url: /api/reset
        json_body: {}
        assertions: {status: 200}
      - type: browser.goto
        url: /app/real
      - type: browser.fill
        target: {label: Email}
        value: "{{email}}"
      - type: browser.click
        target: {role: button, name: Submit lead}
      - type: browser.assert_text
        target: "#status"
        contains: Saved
      - type: network.assert
        kind: response
        url_contains: /api/leads
        method: POST
        status: 201
        minimum: 1
        maximum: 1
      - type: http.poll
        method: GET
        url: /api/leads?email={{email}}
        poll_timeout_ms: 3000
        interval_ms: 100
        assertions:
          status: 200
          json:
            - {path: $.count, equals: 1}
            - {path: "$.items[0].email", equals: "{{email}}"}
      - type: browser.audit_accessibility
        maximum_violations: 0
      - type: browser.assert_performance
        max_load_ms: 5000
