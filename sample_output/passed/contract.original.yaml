version: 1
name: Demo API health and persistence
base_url: http://127.0.0.1:8765
variables:
  email: http+{{run_id}}@example.com
policy:
  allowed_hosts: [127.0.0.1, localhost]
  timeout_ms: 5000
evidence:
  output_dir: evidence
  screenshot: never
  trace: never
flows:
  - id: api-exact-once
    claim: A direct API write creates exactly one readable lead.
    steps:
      - {type: http.request, method: POST, url: /api/reset, json_body: {}, assertions: {status: 200}}
      - type: http.request
        method: POST
        url: /api/leads
        json_body: {email: "{{email}}"}
        assertions:
          status: 201
          json:
            - {path: $.email, equals: "{{email}}"}
      - type: http.poll
        method: GET
        url: /api/leads?email={{email}}
        poll_timeout_ms: 2000
        interval_ms: 100
        assertions:
          status: 200
          json:
            - {path: $.count, equals: 1}
